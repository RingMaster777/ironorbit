org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin 2.x's incremental compiler cache tries to compute a relative path
# between dependency sources (pub cache, usually on C:) and this project's
# build dir. On Windows, when those sit on different drive letters, that
# throws "this and base files have different roots" and fails the build.
# Disabling incremental compilation avoids the crash; cost is a slightly
# slower full recompile each time, which is fine given how little native
# Kotlin this app actually has (plugin glue + one MainActivity.kt).
kotlin.incremental=false
